name: Publish Chrome

on:
  workflow_dispatch:

# Publishes the version currently on main to the Chrome Web Store. It does NOT
# bump the version or touch git — run the Firefox "Publish" workflow first so
# the version is bumped/tagged, then run this to ship the same version to Chrome.
jobs:
  publish-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Publish to Chrome Web Store
        run: node scripts/publish-chrome.js
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
